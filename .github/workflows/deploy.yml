# ==========================================================
# EONLABS — DEPLOY OFICIAL
#
# Site oficial:
# https://eonlabs-tech.github.io/
#
# Código-fonte:
# CicDEV83/Landing-page-sobre-mim-com-projetos-e-atualizacao
#
# Aplicações:
# - EonLabs institucional
# - App Clima Global Dashboard
# - Conversor Global Pro
# - EonMusic (preservado no código-fonte)
#
# ==========================================================

name: Deploy EonLabs Tech

on:
  workflow_dispatch:

  repository_dispatch:
    types:
      - atualizar-eonlabs

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: eonlabs-tech-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build EonLabs Oficial

    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 1. BAIXAR CÓDIGO-FONTE
      # ==========================================

      - name: Checkout EonLabs source
        uses: actions/checkout@v4
        with:
          repository: CicDEV83/Landing-page-sobre-mim-com-projetos-e-atualizacao
          ref: main
          path: source
          persist-credentials: false

      # ==========================================
      # 2. CONFIGURAR NODE.JS
      # ==========================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ==========================================
      # 3. INSTALAR DEPENDÊNCIAS DA EONLABS
      # ==========================================

      - name: Install EonLabs dependencies
        working-directory: source
        run: npm ci

      # ==========================================
      # 4. VALIDAR QUALIDADE DO CÓDIGO
      # ==========================================

      - name: Run ESLint
        working-directory: source
        run: npm run lint

      # ==========================================
      # 5. COMPILAR SITE INSTITUCIONAL
      # ==========================================

      - name: Build EonLabs website
        working-directory: source
        run: npm run build -- --base=/

      # ==========================================
      # 6. INTEGRAR CONVERSOR GLOBAL PRO
      # ==========================================

      - name: Copy Currency Converter
        working-directory: source
        run: |
          mkdir -p dist/currency-converter-pro
          cp -R currency-converter-pro/. dist/currency-converter-pro/

      # ==========================================
      # 7. INSTALAR DEPENDÊNCIAS DO APP CLIMA
      # ==========================================

      - name: Install Climate Dashboard dependencies
        working-directory: source/app-clima-global-dashboard
        run: npm ci

      # ==========================================
      # 8. COMPILAR APP CLIMA GLOBAL
      # ==========================================

      - name: Build App Clima Global
        working-directory: source/app-clima-global-dashboard

        env:
          VITE_OPENWEATHER_API_KEY: ${{ secrets.VITE_OPENWEATHER_API_KEY }}

        run: npm run build -- --base=/app-clima-global/

      # ==========================================
      # 9. INTEGRAR APP CLIMA AO SITE
      # ==========================================

      - name: Copy App Clima Global
        working-directory: source
        run: |
          mkdir -p dist/app-clima-global
          cp -R app-clima-global-dashboard/dist/. dist/app-clima-global/

      # ==========================================
      # 10. EONMUSIC
      # ==========================================

      # EonMusic permanece preservado no
      # repositório de código-fonte.
      #
      # Sua publicação independente será
      # configurada após validar o build
      # e a navegação da aplicação.

      # ==========================================
      # 11. CONFIGURAR GITHUB PAGES
      # ==========================================

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      # ==========================================
      # 12. ENVIAR ARQUIVOS COMPILADOS
      # ==========================================

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: source/dist

  deploy:
    name: Publicar EonLabs Oficial

    runs-on: ubuntu-latest

    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # ==========================================
      # 13. PUBLICAR SITE
      # ==========================================

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
