
name: Deploy EonLabs Tech

on:
  workflow_dispatch:
  repository_dispatch:
    types: [atualizar-eonlabs]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: eonlabs-tech-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout EonLabs source
        uses: actions/checkout@v4
        with:
          repository: CicDEV83/Landing-page-sobre-mim-com-projetos-e-atualizacao
          ref: main
          path: source
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: source
        run: npm ci

      - name: Build EonLabs website
        working-directory: source
        run: npm run build -- --base=/

      - name: Copy static projects
        working-directory: source
        run: |
          cp -R projeto1-app-clima dist/projeto1-app-clima
          cp -R task-manager-pro dist/task-manager-pro
          cp -R currency-converter-pro dist/currency-converter-pro

      - name: Install App Clima dependencies
        working-directory: source/app-clima-global-dashboard
        run: npm ci

      - name: Build App Clima Global
        working-directory: source/app-clima-global-dashboard
        env:
          VITE_OPENWEATHER_API_KEY: ${{ secrets.VITE_OPENWEATHER_API_KEY }}
        run: npm run build -- --base=/app-clima-global/

      - name: Copy App Clima Global
        working-directory: source
        run: |
          mkdir -p dist/app-clima-global
          cp -R app-clima-global-dashboard/dist/. dist/app-clima-global/

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: source/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
